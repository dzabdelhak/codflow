# Production stack for one server (ADR-0003). Installed and upgraded by
# deploy/install.sh from a git checkout and a secrets file; never typed by
# hand. See docs/DEPLOYMENT.md.
#
# Every app runs replicated (APP_REPLICAS, default 2) behind Caddy and keeps
# no local state: PostgreSQL holds the data and the queues, Redis the
# sessions cache and rate limits, SeaweedFS the images. Stopping one replica
# does not interrupt the storefront or order transmission.
name: codflow-platform

x-app: &app
  restart: unless-stopped
  stop_grace_period: 30s
  deploy:
    replicas: ${APP_REPLICAS:-2}
  logging: &logging
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-database-url: &database-url postgres://codflow:${POSTGRES_PASSWORD:?}@db:5432/codflow
x-public-api-url: &public-api-url https://api.${BASE_DOMAIN:?}
x-public-app-url: &public-app-url https://app.${BASE_DOMAIN:?}

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    shm_size: 256mb
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_USER: codflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: codflow
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codflow", "-d", "codflow"]
      interval: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    logging: *logging

  objects:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-volume.max=0"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
    volumes: [objectdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      retries: 60
    logging: *logging

  # Migrations, reference data and legal pages, on every install. Idempotent.
  setup:
    image: codflow/api:${CODFLOW_RELEASE:-latest}
    build: { context: .., dockerfile: docker/api.Dockerfile }
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed:legal-pages"]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  api:
    <<: *app
    image: codflow/api:${CODFLOW_RELEASE:-latest}
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: production
      PUBLIC_API_URL: *public-api-url
      ALLOWED_ORIGINS: *public-app-url
      BETTER_AUTH_URL: *public-app-url
      BETTER_AUTH_JWKS_URL: http://dashboard:4321/api/auth/jwks
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      STOREFRONT_SERVICE_KEY: ${STOREFRONT_SERVICE_KEY:?}
      STOREFRONT_INTERNAL_URL: http://storefront:4321
      STORE_BASE_DOMAIN: ${BASE_DOMAIN:?}
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      CUSTOM_DOMAIN_IPV4: ${CUSTOM_DOMAIN_IPV4:-}
      TLS_PROBE_HOST: caddy
      S3_ENDPOINT: http://objects:8333
      S3_BUCKET: codflow-images
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      IMAGES_PUBLIC_URL: https://api.${BASE_DOMAIN:?}/images
      ORDER_DESTINATION: ${ORDER_DESTINATION:-test}
      AVENTY_KEY_ENCRYPTION_KEY: ${AVENTY_KEY_ENCRYPTION_KEY:-}
      AVENTY_KEY_ENCRYPTION_KEY_PREVIOUS: ${AVENTY_KEY_ENCRYPTION_KEY_PREVIOUS:-}
    depends_on:
      setup: { condition: service_completed_successfully }
      objects: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30

  storefront:
    <<: *app
    image: codflow/storefront:${CODFLOW_RELEASE:-latest}
    build: { context: .., dockerfile: docker/storefront.Dockerfile }
    environment:
      COD_SERVER_URL: http://api:8787
      STOREFRONT_SERVICE_KEY: ${STOREFRONT_SERVICE_KEY:?}
      MEDIA_URL: https://api.${BASE_DOMAIN:?}/images
      TRUSTED_PROXY_IP_HEADER: x-visitor-ip
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30

  dashboard:
    <<: *app
    image: codflow/dashboard:${CODFLOW_RELEASE:-latest}
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
      args: { PUBLIC_API_URL: "https://api.${BASE_DOMAIN:?}" }
    environment:
      DATABASE_URL: *database-url
      REDIS_URL: redis://redis:6379
      PUBLIC_APP_URL: *public-app-url
      PUBLIC_API_URL: *public-api-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
    depends_on:
      setup: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321/sign-in').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      retries: 30

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on: [api, storefront, dashboard]
    logging: *logging

  # Nightly dump to the off-server backup (BACKUP_REMOTE), a nightly restore
  # test of that dump, and a disk check — each reported to Uptime Kuma.
  backup:
    image: codflow/backup:${CODFLOW_RELEASE:-latest}
    build: { context: ./backup }
    restart: unless-stopped
    env_file:
      - path: ${CODFLOW_BACKUP_ENV:-/etc/codflow/backup.env}
        required: false
    environment:
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      DISK_ALERT_PERCENT: ${DISK_ALERT_PERCENT:-85}
      PGHOST: db
      PGUSER: codflow
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      PGDATABASE: codflow
      RCLONE_CONFIG_OBJECTS_TYPE: s3
      RCLONE_CONFIG_OBJECTS_PROVIDER: SeaweedFS
      RCLONE_CONFIG_OBJECTS_ENDPOINT: http://objects:8333
      RCLONE_CONFIG_OBJECTS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      RCLONE_CONFIG_OBJECTS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      KUMA_PUSH_URL: http://kuma:3001/api/push
    volumes:
      - backups:/backups
      - /var/lib/codflow/disk-probe:/host-root:ro
    depends_on:
      db: { condition: service_healthy }
    logging: *logging

  kuma:
    image: louislam/uptime-kuma:2.5.6
    restart: unless-stopped
    environment:
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes: [kumadata:/app/data]
    logging: *logging

  # Creates Kuma's admin on a fresh install (Kuma has no setting for it).
  kuma-setup:
    image: node:24-alpine
    command: ["node", "/monitoring/kuma-setup.mjs"]
    environment:
      KUMA_URL: http://kuma:3001
      KUMA_USERNAME: ${KUMA_ADMIN_USER:-admin}
      KUMA_PASSWORD: ${KUMA_ADMIN_PASSWORD:?}
    volumes: ["./monitoring:/monitoring:ro"]
    depends_on: [kuma]
    logging: *logging

  # Keeps Kuma's monitors and alert channel equal to deploy/monitoring/monitors.
  autokuma:
    image: ghcr.io/bigboot/autokuma:2.0.0
    restart: unless-stopped
    environment:
      AUTOKUMA__KUMA__URL: http://kuma:3001
      AUTOKUMA__KUMA__USERNAME: ${KUMA_ADMIN_USER:-admin}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_ADMIN_PASSWORD:?}
      AUTOKUMA__DOCKER__ENABLED: "false"
      AUTOKUMA__STATIC_MONITORS: /monitors
      AUTOKUMA__ON_DELETE: delete
      AUTOKUMA__ENV__BASE_DOMAIN: ${BASE_DOMAIN:?}
      AUTOKUMA__ENV__SMTP_HOST: ${SMTP_HOST:?}
      AUTOKUMA__ENV__SMTP_PORT: ${SMTP_PORT:-587}
      AUTOKUMA__ENV__SMTP_USER: ${SMTP_USER:-}
      AUTOKUMA__ENV__SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      AUTOKUMA__ENV__ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:?}
      AUTOKUMA__ENV__ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?}
    volumes:
      - ./monitoring/monitors:/monitors:ro
      - autokumadata:/data
    depends_on:
      kuma-setup: { condition: service_completed_successfully }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  objectdata:
  caddydata:
  caddyconfig:
  backups:
  kumadata:
  autokumadata:
