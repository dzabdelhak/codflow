# Local platform stack (ADR-0003). From the repo root:
#
#   docker compose up --build
#
# then open http://shop1.localhost:8090 and http://shop2.localhost:8090 — two
# demo channels served by the same storefront, each showing only its own data —
# and the dashboard at http://app.localhost:8090 (admin@example.com, password
# COD_ADMIN_PASSWORD, default "admin-dev-password").
#
# Host ports are overridable: COD_HTTP_PORT, COD_PG_PORT, COD_REDIS_PORT.
# The storefront key is a local-only default; set COD_STOREFRONT_SERVICE_KEY
# for anything else. Images are stored in SeaweedFS (S3 API), reached only by
# the API; its credentials are COD_S3_ACCESS_KEY / COD_S3_SECRET_KEY (local
# defaults below).
name: codflow

x-storefront-key: &storefront-key ${COD_STOREFRONT_SERVICE_KEY:-local-dev-storefront-key}
x-auth-secret: &auth-secret ${COD_BETTER_AUTH_SECRET:-local-dev-better-auth-secret-0123456789abcdef}
x-ticket-secret: &ticket-secret ${COD_MCP_LOGIN_TICKET_SECRET:-local-dev-mcp-login-ticket-secret-0123456789}
x-s3-access-key: &s3-access-key ${COD_S3_ACCESS_KEY:-codflow-local}
x-s3-secret-key: &s3-secret-key ${COD_S3_SECRET_KEY:-codflow-local-secret}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: codflow
      POSTGRES_PASSWORD: codflow
      POSTGRES_DB: codflow
    ports: ["${COD_PG_PORT:-5440}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "codflow", "-d", "codflow"]
      interval: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    ports: ["${COD_REDIS_PORT:-6390}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # S3-compatible image storage, private to the stack (cod-server is its only client).
  objects:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-ip.bind=0.0.0.0", "-dir=/data", "-s3", "-volume.max=0"]
    environment:
      AWS_ACCESS_KEY_ID: *s3-access-key
      AWS_SECRET_ACCESS_KEY: *s3-secret-key
    volumes: [objectdata:/data]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      retries: 60

  # Migrations, the two demo channels and their legal pages. Idempotent.
  setup:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["npm", "run", "db:setup"]
    environment:
      DATABASE_URL: postgres://codflow:codflow@db:5432/codflow
    depends_on:
      db: { condition: service_healthy }

  # The demo merchant's admin, for the dashboard. Resets its password each run.
  admin:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args: { PUBLIC_API_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}" }
    command: ["node", "scripts/seed-admin.mjs", "${COD_ADMIN_PASSWORD:-admin-dev-password}", "--merchant=demo-merchant"]
    environment:
      DATABASE_URL: postgres://codflow:codflow@db:5432/codflow
    depends_on:
      setup: { condition: service_completed_successfully }

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    environment:
      DATABASE_URL: postgres://codflow:codflow@db:5432/codflow
      STOREFRONT_SERVICE_KEY: *storefront-key
      ENVIRONMENT: development
      STORE_BASE_DOMAIN: localhost
      STOREFRONT_INTERNAL_URL: http://storefront:4321
      ALLOWED_ORIGINS: "http://app.localhost:${COD_HTTP_PORT:-8090}"
      WORKER_SELF_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}"
      BETTER_AUTH_URL: "http://app.localhost:${COD_HTTP_PORT:-8090}"
      BETTER_AUTH_JWKS_URL: http://dashboard:4321/api/auth/jwks
      BETTER_AUTH_SECRET: *auth-secret
      MCP_LOGIN_TICKET_SECRET: *ticket-secret
      S3_ENDPOINT: http://objects:8333
      S3_BUCKET: codflow-images
      S3_ACCESS_KEY_ID: *s3-access-key
      S3_SECRET_ACCESS_KEY: *s3-secret-key
      IMAGES_PUBLIC_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}/images"
      CUSTOM_DOMAIN_TARGET: ${CUSTOM_DOMAIN_TARGET:-}
      CUSTOM_DOMAIN_IPV4: ${CUSTOM_DOMAIN_IPV4:-127.0.0.1}
      TLS_PROBE_HOST: caddy
    depends_on:
      setup: { condition: service_completed_successfully }
      objects: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      retries: 30

  storefront:
    build: { context: ., dockerfile: docker/storefront.Dockerfile }
    environment:
      COD_SERVER_URL: http://api:8787
      STOREFRONT_SERVICE_KEY: *storefront-key
      MEDIA_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}/images"
    depends_on:
      api: { condition: service_healthy }

  dashboard:
    build:
      context: .
      dockerfile: docker/dashboard.Dockerfile
      args: { PUBLIC_API_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}" }
    environment:
      DATABASE_URL: postgres://codflow:codflow@db:5432/codflow
      REDIS_URL: redis://redis:6379
      PUBLIC_APP_URL: "http://app.localhost:${COD_HTTP_PORT:-8090}"
      PUBLIC_API_URL: "http://api.localhost:${COD_HTTP_PORT:-8090}"
      BETTER_AUTH_SECRET: *auth-secret
      MCP_LOGIN_TICKET_SECRET: *ticket-secret
    depends_on:
      admin: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    ports: ["${COD_HTTP_PORT:-8090}:80", "${COD_HTTPS_PORT:-8443}:443"]
    volumes: ["./docker/Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data"]
    depends_on: [api, storefront, dashboard]

volumes:
  caddydata:
  pgdata:
  objectdata:
