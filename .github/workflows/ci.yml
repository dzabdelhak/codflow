name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: cod-server (typecheck + test)
    runs-on: ubuntu-latest
    services:
      # Tests run on a real PostgreSQL (src/test-utils/pg.ts). The user must
      # be able to create databases and roles: it builds a migrated template
      # once, then one database per test file.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: codflow
          POSTGRES_PASSWORD: codflow
          POSTGRES_DB: codflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U codflow -d codflow"
          --health-interval 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://codflow:codflow@localhost:5432/codflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace codflow-server
      - run: npm test --workspace codflow-server

  dashboard:
    name: cod-client-astro (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace codflow-client-astro
      - run: npm run build --workspace codflow-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787
      - run: npm test --workspace codflow-client-astro
        env:
          PUBLIC_API_URL: http://localhost:8787

  theme01:
    name: theme01 (astro check + test + validate + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx astro check
        working-directory: cod-astro/theme01
      - run: npm test
        working-directory: cod-astro/theme01
      - run: npm run validate:all
        working-directory: cod-astro/theme01
      - run: npm run build
        working-directory: cod-astro/theme01

  deploy:
    name: deploy (compose, Caddyfile, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: compose file resolves with the secrets template
        run: |
          sed -E 's/^([A-Z0-9_]*(PASSWORD|SECRET|KEY)[A-Z0-9_]*)=$/\1=ci-0123456789abcdef0123456789abcdef/' deploy/secrets.env.example > "$RUNNER_TEMP/secrets.env"
          docker compose -f deploy/compose.yml --env-file "$RUNNER_TEMP/secrets.env" config -q
      - name: Caddyfile is valid
        run: >-
          docker run --rm -v "$PWD/deploy/caddy:/etc/caddy:ro"
          -e BASE_DOMAIN=example.dz -e ACME_EMAIL=ops@example.dz
          caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: shell scripts
        run: shellcheck -S warning -e SC2034 deploy/install.sh deploy/backup/*.sh

